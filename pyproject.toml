[project]
name = "rag"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "chromadb>=1.0.15",              # 向量資料庫（Vector Database），儲存片段與向量並做相似度查詢
    "google-genai>=1.24.0",          # Google Gemini SDK，呼叫 LLM 生成（Generate）回答
    "python-dotenv>=1.1.1",          # 讀取 .env 檔，載入 GEMINI_API_KEY
    "sentence-transformers>=5.0.0",  # 載入嵌入模型（Embedding Model）與交叉編碼器（Cross-Encoder）做重排（Rerank）
]

[tool.uv.workspace]
members = [
    "python_rag",
]
